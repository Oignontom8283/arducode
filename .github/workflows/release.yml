name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check the tag matches the extension version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/arducode.vsix "dist/arducode-${TAG#v}.vsix"
          gh release upload "$TAG" "dist/arducode-${TAG#v}.vsix" --clobber
